[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marinecast-ais"
version = "0.3.0"
description = "Contract-first, offline AIS normalization foundation"
requires-python = ">=3.11"
dependencies = ["pyarrow>=20,<26", "zstandard>=0.23,<0.26", "h3>=4.2,<5", "shapely>=2.1,<3"]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.11", "pytest>=8"]

[project.scripts]
ais = "ais_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ais_toolkit = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
